<header class="navbar">

    <nav>
        <a href="index.html">Home</a>
        <a href="videos.html">Videos</a>
        <a href="about.html">About</a>
        <a href="contact.html" class="active">Contact</a>
    </nav>

</header>


<main>

<section class="contact-page">

    <p class="eyebrow">LET'S WORK TOGETHER</p>

    <h1>
        Have something
        worth creating?
    </h1>

    <p>
        Tell me about your brand, product or campaign.
    </p>


    <form action="https://formsubmit.co/dabadibo.tttt@gmail.com
" method="POST">

        <input
            type="text"
            name="name"
            placeholder="Your name"
            required>

        <input
            type="email"
            name="email"
            placeholder="Your email"
            required>

        <input
            type="text"
            name="brand"
            placeholder="Brand / Company">

        <textarea
            name="message"
            rows="7"
            placeholder="Tell me what you're looking for..."
            required></textarea>

        <button type="submit">
            Send message →
        </button>

    </form>

</section>

</main>

    <p>© 2026 Qusai Daboubi</p>
